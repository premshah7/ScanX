apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanx-web
  namespace: scanx-prod
  labels:
    app: scanx-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scanx-web
  template:
    metadata:
      labels:
        app: scanx-web
    spec:
      containers:
        - name: web
          image: ghcr.io/scanx/scanx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: scanx-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: scanx-config
                  key: PORT
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: scanx-config
                  key: NEXTAUTH_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scanx-secret
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: scanx-secret
                  key: NEXTAUTH_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
