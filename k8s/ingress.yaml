apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scanx-ingress
  namespace: scanx-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - scanx.example.com
      secretName: scanx-tls-cert
  rules:
    - host: scanx.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scanx-web-service
                port:
                  number: 80
