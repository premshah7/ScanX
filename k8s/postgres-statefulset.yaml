apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scanx-postgres
  namespace: scanx-prod
spec:
  serviceName: scanx-postgres
  replicas: 1
  selector:
    matchLabels:
      app: scanx-postgres
  template:
    metadata:
      labels:
        app: scanx-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: scanx-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: scanx-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scanx-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: scanx-postgres
  namespace: scanx-prod
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: scanx-postgres
  clusterIP: None
