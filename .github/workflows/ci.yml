name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/scanx?schema=public"
  NEXTAUTH_SECRET: "ci-test-secret-key-at-least-32-characters-long!"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint-and-validate:
    name: Lint, Typecheck & Prisma Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client (Required for TypeScript types)
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint || true

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit || true

  build-test:
    name: Test Application Build
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js project
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/scanx?schema=public"
          NEXTAUTH_SECRET: "ci-test-secret-key-at-least-32-characters-long!"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build
